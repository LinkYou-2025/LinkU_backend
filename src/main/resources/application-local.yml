spring:
  config:
    import: optional:classpath:application-secret.properties

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    locations:
      - classpath:db/local/migration
      - classpath:db/local/seed
    placeholders:
      cloudfrontDomain: ${AWS_CLOUDFRONT_DOMAIN}

logging:
  level:
    root: INFO
    com.umc.linkyou: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
