<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>LinkU 열기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script th:inline="javascript">
        // 전역 변수로 선언하여 버튼 핸들러에서 접근 가능하게
        // ▼ 서버 URL (GitHub Actions secrets에서 주입)
        const serverBaseUrl = /*[[${serverBaseUrl}]]*/ '';
        
        // ▼ 앱 패키지/스토어 주소
        const pkg = "com.example.linku_android";
        const playStoreUrl = "https://play.google.com/store/apps/details?id=" + pkg;

        // ▼ 쿼리 파라미터 파싱
        const params = new URLSearchParams(location.search);
        const action = params.get("action") || "share";
        const folderId = params.get("folderId");

        // intent:// URL 만들기 (Android 전용)
        const intentUrl = (() => {
            const qp = [];
            if (action) qp.push("action=" + encodeURIComponent(action));
            if (folderId) qp.push("folderId=" + encodeURIComponent(folderId));
            const query = qp.length ? ("?" + qp.join("&")) : "";
            return "intent://open" + query +
                "#Intent;scheme=linku;package=" + pkg +
                ";S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) +
                ";end";
        })();

        // 커스텀 스킴 URL (linku://)
        const customSchemeUrl = (() => {
            const qp = [];
            if (action) qp.push("action=" + encodeURIComponent(action));
            if (folderId) qp.push("folderId=" + encodeURIComponent(folderId));
            const query = qp.length ? ("?" + qp.join("&")) : "";
            return "linku://open" + query;
        })();

        // ▼ 환경 감지
        const ua = navigator.userAgent || "";
        const isAndroid = /Android/i.test(ua);

        function openAppWithFallback() {
            if (!isAndroid) {
                // iOS 등 다른 플랫폼이면 스토어로 이동
                location.replace(playStoreUrl);
                return;
            }

            // 1순위: intent:// 시도
            try { 
                location.href = intentUrl; 
            } catch (e) {
                console.error("Intent URL 실패:", e);
            }

            // 2순위: 커스텀 스킴 직접 시도
            setTimeout(() => {
                try { 
                    location.href = customSchemeUrl; 
                } catch (e) {
                    console.error("Custom scheme 실패:", e);
                }
            }, 300);

            // 3순위: 앱이 없거나 실패 → 스토어 이동
            setTimeout(() => {
                location.href = playStoreUrl;
            }, 1800);
        }

        // 앱 열기 버튼 클릭 핸들러
        function handleOpenAppClick(e) {
            e.preventDefault();
            openAppWithFallback();
        }

        // DOM 준비되면 즉시 시도
        window.addEventListener("DOMContentLoaded", function() {
            openAppWithFallback();
            
            // 버튼 이벤트 리스너 등록
            const openAppBtn = document.getElementById("open-app");
            if (openAppBtn) {
                openAppBtn.addEventListener("click", handleOpenAppClick);
            }
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, Roboto, "Noto Sans KR", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 560px;
            width: 100%;
        }
        
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 48px 32px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        
        .logo-container {
            margin-bottom: 32px;
        }
        
        .logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #718096;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }
        
        .btn {
            display: inline-block;
            padding: 16px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-secondary {
            background: #f7fafc;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }
        
        .footer-text {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
            color: #a0aec0;
        }
        
        @media (max-width: 640px) {
            .card {
                padding: 32px 24px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo-container">
            <img th:src="${logoUrl}" alt="LinkU" class="logo" />
        </div>
        
        <h1 class="title">앱을 여는 중…</h1>
        <p class="subtitle">잠시만 기다려 주세요.<br>앱이 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</p>
        
        <div class="loading-spinner"></div>
        
        <div class="button-group">
            <a id="open-app" class="btn btn-primary" href="javascript:void(0)">앱으로 열기</a>
            <a id="play-store" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.example.linku_android" target="_blank">Play 스토어에서 다운로드</a>
        </div>
        
        <p class="footer-text">© 2024 LinkU. All rights reserved.</p>
    </div>
</div>

</body>
</html>
