<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>LinkU 열기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
        (function() {
            // ▼ 앱 패키지/스토어 주소(수정해야 함)
            const pkg = "com.example.linku_android";
            const play = "https://play.google.com/store/apps/details?id=" + pkg;

            // ▼ 쿼리 파라미터 파싱
            const params = new URLSearchParams(location.search);
            const action = params.get("action") || "share";

            const folderId = params.get("folderId");
            //const token = params.get("token"); // 불투명 토큰 방식 도입 시

            // 커스텀 스킴 & intent:// URL 만들기
            // 커스텀 스킴: linku://open?action=...&folderId=...
            const custom = (() => {
                const usp = new URLSearchParams();
                if (token) usp.set("token", token);
                else {
                    if (action) usp.set("action", action);
                    if (folderId) usp.set("folderId", folderId);
                }
                return "linku://open" + (usp.toString() ? ("?" + usp.toString()) : "");
            })();

            // intent:// (Android 전용; 패키지/스토어 fallback 포함)
            // - scheme=linku 로 맞춰 커스텀 스킴 경로를 OS로 던짐
            // - browser_fallback_url 로 스토어 지정
            const intentUrl = (() => {
                const qp = [];
                if (token) qp.push("token=" + encodeURIComponent(token));
                else {
                    if (action) qp.push("action=" + encodeURIComponent(action));
                    if (folderId) qp.push("folderId=" + encodeURIComponent(folderId));
                }
                const query = qp.length ? ("?" + qp.join("&")) : "";
                return "intent://open" + query +
                    "#Intent;scheme=linku;package=" + pkg +
                    ";S.browser_fallback_url=" + encodeURIComponent(play) +
                    ";end";
            })();

            // ▼ 환경 감지 (간단판)
            const ua = navigator.userAgent || "";
            const isAndroid = /Android/i.test(ua);
            const isKakao = /KAKAOTALK/i.test(ua);
            const isLine = /Line\//i.test(ua);
            const isNaver = /NAVER/i.test(ua);
            const isInstagram = /Instagram/i.test(ua);
            const isInApp = isKakao || isLine || isNaver || isInstagram;

            function openAppWithFallback() {
                if (!isAndroid) {
                    // iOS 등 다른 플랫폼이면 안내 or 다른 흐름 (여긴 안드 전용이라 간단처리)
                    location.replace(play);
                    return;
                }

                // 1순위: intent:// 시도 (카톡 WebView가 잘 처리하는 편)
                try { location.href = intentUrl; } catch (e) {}

                // 2순위: 커스텀 스킴 직접 시도
                setTimeout(() => {
                    try { location.href = custom; } catch (e) {}
                }, 300);

                // 3순위: 앱이 없거나 실패 → 스토어 이동
                setTimeout(() => {
                    try { location.href = play; } catch (e) {}
                }, 1800);
            }

            // DOM 준비되면 즉시 시도
            window.addEventListener("DOMContentLoaded", openAppWithFallback);
        })();
    </script>

    <style>
        body { font-family: system-ui, -apple-system, Roboto, "Noto Sans KR", Arial, sans-serif;
            margin: 0; padding: 24px; line-height: 1.6; }
        .card { max-width: 560px; margin: 0 auto; padding: 20px; border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,.08); }
        .btn { display: inline-block; padding: 12px 16px; border-radius: 10px;
            text-decoration: none; border: 1px solid #ddd; margin-right: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h2>앱을 여는 중…</h2>
    <p>잠시만 기다려 주세요. 앱이 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.</p>
    <p>
        <a id="open-app" class="btn" href="#">앱으로 열기</a>
        <a class="btn" href="https://play.google.com/store/apps/details?id=com.example.linku_android">Play 스토어</a>
    </p>
</div>

<script>
    // 수동 버튼(혹시 자동 실패 시)
    document.getElementById("open-app").addEventListener("click", function(e) {
        e.preventDefault();
        // 위에서 만든 intentUrl / custom를 다시 시도
        // 전역에 보관했다면 그걸 쓰면 되고, 여기선 간단하게 다시 계산해도 됨
        history.go(0); // 페이지 재실행으로 동일 흐름 재시도
    });
</script>
</body>
</html>
