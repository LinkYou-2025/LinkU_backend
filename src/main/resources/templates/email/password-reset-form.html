<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>[링큐] 비밀번호 재설정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 12px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: #ffffff;
            border: 1px solid #E6E6E6;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(22, 35, 64, 0.10);
        }

        .header {
            padding: 18px 24px 20px 24px;
            background-color: #2C6FFF;
            background-image: linear-gradient(90deg, #2C6FFF 0%, #C800FF 100%);
        }

        .logo {
            width: 50px;
            display: block;
        }

        .header-copy {
            margin-top: 8px;
            color: #F7F7F7;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.35;
        }

        .content {
            padding: 26px 28px 34px 28px;
        }

        .eyebrow {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.25;
            color: #2C6FFF;
        }

        .title {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.25;
            color: #000208;
            margin-top: 5px;
        }

        .subtitle {
            margin-top: 14px;
            color: #5F6167;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.55;
        }

        .message {
            margin-top: 20px;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.6;
        }

        .message.success {
            background: #EAF8EE;
            border: 1px solid #A8E1B8;
            color: #1C7C43;
        }

        .message.error {
            background: #FFF1F2;
            border: 1px solid #FFB5BE;
            color: #B42318;
        }

        .form-box {
            margin-top: 26px;
            background: #F8FAFF;
            border: 1px solid #DCE7FF;
            border-radius: 20px;
            padding: 24px 20px 20px 20px;
        }

        .label {
            display: block;
            color: #3C4352;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            border: 1px solid #C9D7FF;
            border-radius: 14px;
            background: #ffffff;
            padding: 14px 16px;
            font-size: 15px;
            color: #111827;
            margin-bottom: 18px;
            outline: none;
        }

        .input:focus {
            border-color: #2C6FFF;
            box-shadow: 0 0 0 4px rgba(44, 111, 255, 0.10);
        }

        .password-guide {
            margin: -10px 0 18px;
            color: #5F6167;
            font-size: 13px;
            line-height: 1.5;
        }

        .submit-wrap {
            margin-top: 8px;
            text-align: center;
        }

        .submit-btn {
            display: inline-block;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px 20px;
            background-color: #2C6FFF;
            background-image: linear-gradient(90deg, #2C6FFF 0%, #C800FF 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .footer {
            border-top: 1px solid #EFF4FB;
            padding: 16px 28px 18px 28px;
            color: #989898;
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
        }

        .footer-left {
            float: left;
        }

        .footer-right {
            float: right;
            font-size: 12px;
        }

        .footer-right a {
            color: #989898;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .content {
                padding: 22px 20px 28px 20px;
            }

            .title {
                font-size: 26px;
            }

            .subtitle {
                font-size: 16px;
            }

            .footer {
                padding: 16px 20px 18px 20px;
            }

            .footer-left,
            .footer-right {
                float: none;
                display: block;
            }

            .footer-right {
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header">
        <img
                src="https://d3f9zmi4jicqrs.cloudfront.net/linkuLogo/logo_white.png"
                alt="Link U"
                class="logo"
        />
        <div class="header-copy">Link U, Think You</div>
    </div>

    <div class="content">
        <div class="eyebrow">[링큐]</div>
        <div class="title">비밀번호 재설정</div>

        <div th:if="${success == null and (token == null or token == '')}">
            <div class="subtitle">요청하신 재설정 링크를 확인하는 중 문제가 발생했습니다.</div>
            <div class="message error">유효하지 않거나 만료된 링크입니다. 비밀번호 재설정을 다시 요청해 주세요.</div>
        </div>

        <div th:if="${success}">
            <div class="subtitle">비밀번호 변경이 정상적으로 완료되었습니다.</div>
            <div class="message success">비밀번호가 성공적으로 변경되었습니다. 앱으로 돌아가 로그인해 주세요.</div>
        </div>

        <div th:if="${token != null and token != '' and success == null}">
            <div class="subtitle">새로운 비밀번호를 입력하고 안전하게 계정을 다시 이용해 주세요.</div>

            <div th:if="${error}" class="message error" th:text="${error}"></div>

            <form th:action="@{/password/reset}" method="post" class="form-box">
                <input type="hidden" name="token" th:value="${token}" />

                <label for="newPassword" class="label">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword"
                       class="input"
                       placeholder="영문 대·소문자, 숫자, 특수문자 포함 8~64자"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="64"
                       required />
                <p class="password-guide">영문 대문자, 영문 소문자, 숫자, 특수문자를 각각 포함해 8~64자로 입력해 주세요.</p>

                <label for="confirmPassword" class="label">비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       class="input"
                       placeholder="비밀번호 다시 입력"
                       autocomplete="new-password"
                       required />

                <div class="submit-wrap">
                    <button type="submit" class="submit-btn">비밀번호 재설정하기</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">ⓒ 2026 | Link U</div>
        <div class="footer-right">
            <a href="#">Unsubscribe</a> |
            <a href="#">Preferences</a>
        </div>
    </div>
</div>
</body>
</html>
