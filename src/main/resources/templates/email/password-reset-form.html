<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link You 비밀번호 재설정</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Apple SD Gothic Neo', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 48px 32px;
            width: 100%;
            max-width: 480px;
        }
        .card::before {
            content: '';
            display: block;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px 4px 0 0;
            margin: -48px -32px 40px;
        }
        h1 { font-size: 24px; font-weight: 700; color: #1a202c; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #718096; margin-bottom: 32px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        input[type=password] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1a202c;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }
        input[type=password]:focus { border-color: #667eea; }
        button[type=submit] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
        }
        .message.success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
        .message.error   { background: #fff5f5; color: #9b2c2c; border: 1px solid #feb2b2; }
        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            .card::before { margin: -32px -20px 32px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>비밀번호 재설정</h1>

    <!-- 토큰 없음 -->
    <div th:if="${success == null and (token == null or token == '')}">
        <p class="message error">유효하지 않거나 만료된 링크입니다. 비밀번호 재설정을 다시 요청해 주세요.</p>
    </div>

    <!-- 변경 완료 -->
    <div th:if="${success}">
        <p class="message success">비밀번호가 성공적으로 변경되었습니다. 앱으로 돌아가 로그인해 주세요.</p>
    </div>

    <!-- 폼 (토큰 있고 아직 완료 안 됨) -->
    <div th:if="${token != null and token != '' and success == null}">
        <p class="subtitle">새 비밀번호를 입력해 주세요.</p>

        <div th:if="${error}" class="message error" th:text="${error}" style="margin-bottom:20px;"></div>

        <form th:action="@{/password/reset}" method="post">
            <input type="hidden" name="token" th:value="${token}" />

            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" name="newPassword"
                   placeholder="새 비밀번호 입력" autocomplete="new-password" required />

            <label for="confirmPassword">비밀번호 확인</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="비밀번호 다시 입력" autocomplete="new-password" required />

            <button type="submit">비밀번호 변경</button>
        </form>
    </div>
</div>
</body>
</html>
