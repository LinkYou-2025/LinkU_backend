spring:
  profiles:
    active: local

  application:
    name: linkyou

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1

  batch:
    job:
      enabled: false

  sql:
    init:
      mode: never

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      url: ${REDIS_URL}
      timeout: ${REDIS_TIMEOUT}

  cloud:
    gcp:
      project-id: linku-server
      location: global

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URI}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: linkyou
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      gemini: {}
      customSearch: {}

jwt:
  redis:
    host: ${JWT_REDIS_HOST}
    port: ${JWT_REDIS_PORT}
  token:
    keys:
      access: ${JWT_ACCESS_TOKEN_KEY}
      refresh: ${JWT_REFRESH_TOKEN_KEY}
    expiration:
      access: 86400000
      refresh: 345600000
  hmac-secret: ${JWT_HMAC_SECRET}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static-region: ap-southeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
      base-url: ${AWS_S3_BASE_URL}
    stack:
      auto: false
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}

email:
  resend:
    api-key: ${RESEND_API_KEY}
    from: ${AWS_EMAIL_FROM}

auth-code-expiration-millis: 600000

custom:
  search:
    api:
      key: ${CUSTOM_SEARCH_API_KEY}
    engine:
      id: ${CUSTOM_SEARCH_ENGINE_ID}

gemini:
  model:
    name: gemini-3.5-flash-lite

app:
  deeplink:
    base-url: ${DEEPLINK_BASE_URL}
  server:
    base-url: ${SERVER_BASE_URL}

recommend:
  home:
    score:
      weight:
        emotion: 0.35
        situation: 0.15
        engagement: 0.15
        popularity: 0.1
        text: 0.1
        keyword: 0.05
        category: 0.1
      normalization:
        view-count-cap: 20
        recency-half-life-days: 14
        popularity-view-count-cap: 1000
        keyword-weight-cap: 20
      confidence:
        # 유저가 직접 고른 감정/situation은 1.0 그대로, AI가 추론한 값은 아래 계수만큼 감쇠한다.
        ai-emotion-discount: 0.8
        ai-situation-discount: 0.8

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

google:
  client-id: ${GOOGLE_CLIENT_ID}

server:
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 127\.0\.0\.1|localhost
