spring:
  config:
    import: optional:classpath:application-secret.properties

  application:
    name: linkyou

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations:
      - classpath:db/migration
      - classpath:db/seed
  sql:
    init:
      mode: never

  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      url: ${REDIS_URL}
      timeout: ${REDIS_TIMEOUT}

  cloud:
    gcp:
      project-id: linku-server
      location: us-central1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URI}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            scope:
              - profile_nickname
              - profile_image
              - account_email
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.umc.linkyou: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  redis:
    host: ${JWT_REDIS_HOST}
    port: ${JWT_REDIS_PORT}
  token:
    keys:
      access: ${JWT_ACCESS_TOKEN_KEY}
      refresh: ${JWT_REFRESH_TOKEN_KEY}
    expiration:
      access: 86400000
      refresh: 345600000
  hmac-secret: ${JWT_HMAC_SECRET}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static-region: ap-southeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
      base-url: ${AWS_S3_BASE_URL}
    stack:
      auto: false
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}
    ses:
      from: ${AWS_EMAIL_FROM}
      access-key: ${AWS_SES_ACCESS_KEY}
      secret-key: ${AWS_SES_SECRET_KEY}
      region: ${AWS_SES_REGION:ap-northeast-2}

auth-code-expiration-millis: 600000

custom:
  search:
    api:
      key: ${CUSTOM_SEARCH_API_KEY}
    engine:
      id: ${CUSTOM_SEARCH_ENGINE_ID}

gemini:
  model:
    name: gemini-2.5-flash-lite
  credentials:
    path: classpath:gcp-credentials.json

app:
  deeplink:
    base-url: ${DEEPLINK_BASE_URL}
  server:
    base-url: ${SERVER_BASE_URL}

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

google:
  client-id: ${GOOGLE_CLIENT_ID}

server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 127\.0\.0\.1|localhost