version: "3.8"

services:
  app:
    image: ${DOCKER_REPO_NAME}:latest
    container_name: linku-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/secrets/application-secret.properties:/app/config/application-secret.properties:ro
      - /home/ubuntu/secrets/linku-firebase-adminsdk.json:/app/config/linku-firebase-adminsdk.json:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
      # DB (같은 compose 네트워크의 postgres 컨테이너로 접속)
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/linkUDB
      DB_USERNAME: linkU
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_TIMEOUT: 5000ms
      JWT_REDIS_HOST: redis
      JWT_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: linku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkUDB
      POSTGRES_USER: linkU
      POSTGRES_PASSWORD: linkU1234
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkU -d linkUDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: linku-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--timeout", "300"]
    # 포트 미노출 — app 컨테이너가 내부 네트워크(redis:6379)로만 접속
    volumes:
      - redis_data:/data

  # 개발 서버 호스트 디스크/CPU/메모리 — 별도 모니터링 서버(linku-monitoring)가
  # 여기 9100 포트를 원격으로 스크레이프함. prometheus/grafana는 이 서버에서 제거하고
  # 모니터링 서버로 이전함 (docker-compose.monitoring.yml 참고)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: linku-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  redis_data:
  postgres_data:
