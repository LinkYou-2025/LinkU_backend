version: "3.8"

# prod — DB는 컨테이너가 아닌 RDS(PostgreSQL 16) 사용
# 서버에 사전 준비 필요:
#   /home/ubuntu/secrets/application-secret.properties  (모든 시크릿 환경변수)

services:
  app:
    image: ${DOCKER_REPO_NAME}:prod
    container_name: linku-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      REDIS_TIMEOUT: 5000ms
      JWT_REDIS_HOST: redis
      JWT_REDIS_PORT: 6379
    volumes:
      - /home/ubuntu/secrets/application-secret.properties:/app/config/application-secret.properties:ro
      - /home/ubuntu/secrets/linku-firebase-adminsdk.json:/app/config/linku-firebase-adminsdk.json:ro
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7
    container_name: linku-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--timeout", "300"]
    volumes:
      - redis_data:/data

  # EC2 호스트 디스크/CPU/메모리
  node-exporter:
    image: prom/node-exporter:latest
    container_name: linku-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  redis_data:
