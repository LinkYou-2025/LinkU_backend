plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.umc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	asciidoctorExt
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.3'

	//implementation 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

// hibernate
	implementation 'org.hibernate.orm:hibernate-core:6.0.2.Final'

// swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

//querydsl dependencies 추가(스프링부트 3.0 이상)
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

// spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
// OAuth2 클라이언트 + 리소스 서버 (소셜 로그인용)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'


// thymeleaf + security
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.2.RELEASE'

// thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

// redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

// AWS S3 연동
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'


// JavaMail API 라이브러리
	implementation 'com.sun.mail:jakarta.mail:2.0.1'
//jsoup 크롤링
	implementation 'org.jsoup:jsoup:1.17.2'

	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	//blue-green
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Google Cloud Vertex AI (Gemini)
	implementation 'com.google.cloud:google-cloud-vertexai:1.14.0'
	implementation 'com.google.protobuf:protobuf-java:3.25.3'

	//social login
	implementation 'com.google.api-client:google-api-client:2.8.0'
	implementation 'com.google.oauth-client:google-oauth-client:1.39.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
	//sendgrid
	implementation 'com.sendgrid:sendgrid-java:4.10.2'

	// REST Docs
	testImplementation 'org.springframework.restdocs:spring-restdocs-core'
	implementation 'net.coobird:thumbnailator:0.4.20'
	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
}

clean {
	delete fileTree(dir: 'src/main/generated', include: '**/*.java')
}


sourceSets {
	main {
		java {
			srcDirs = ['src/main/java', 'src/main/resources', 'src/main/generated']
		}
	}
}

def querydslSrcDir = 'src/main/generated'
clean {
	delete file(querydslSrcDir)
}

tasks.withType(JavaCompile) {
	options.generatedSourceOutputDirectory = file(querydslSrcDir)
}
ext {
	snippetsDir = file('build/generated-snippets')
}

test {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

asciidoctor {
	configurations 'asciidoctorExt'
	baseDirFollowsSourceFile()
	inputs.dir snippetsDir
	dependsOn test
	options.fork = false
}

bootJar {
	dependsOn asciidoctor
	from("${asciidoctor.outputDir}") {
		into 'static/docs'
	}
}
// 1. asciidoctor 작업이 끝나면 생성된 HTML을 static/docs 폴더로 물리적 복사
tasks.register('copyDocument', Copy) {
	dependsOn asciidoctor
	from file("${asciidoctor.outputDir}")
	into file("src/main/resources/static/docs")
}

// 2. build 태스크 실행 시 copyDocument가 자동으로 실행되도록 설정
build {
	dependsOn copyDocument
}
