name: prod-cd
on:
  push:
    branches: [ "production" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create assetlinks.json file
        run: |
          mkdir -p src/main/resources/static/.well-known
          echo '${{ secrets.ASSETLINKS_JSON }}' > src/main/resources/static/.well-known/assetlinks.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t app .
          docker tag app ${{ secrets.DOCKER_REPO_NAME }}:prod
          docker push ${{ secrets.DOCKER_REPO_NAME }}:prod

      - name: Copy compose file to prod
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "docker-compose.prod.yml,prometheus.yml,grafana"
          target: "/home/ubuntu/linkyou/"

      - name: Deploy to prod
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/linkyou
            if [ ! -f /home/ubuntu/secrets/application-secret.properties ]; then
              echo "ERROR: /home/ubuntu/secrets/application-secret.properties not found"
              exit 1
            fi

            echo "DOCKER_REPO_NAME=${{ secrets.DOCKER_REPO_NAME }}" > /home/ubuntu/linkyou/.env
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> /home/ubuntu/linkyou/.env

            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull ${{ secrets.DOCKER_REPO_NAME }}:prod

            cd /home/ubuntu/linkyou
            sudo docker compose -f docker-compose.prod.yml down
            sudo docker compose -f docker-compose.prod.yml up -d

            sudo docker image prune -a -f

      - name: Wait for Spring Boot to be ready
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # Spring 컨테이너가 완전히 기동될 때까지 확인
            RETRIES=10
            until curl -s http://localhost:8080/actuator/health || [ $RETRIES -eq 0 ]; do
              echo "Waiting for Spring Boot app to start..."
              sleep 5
              RETRIES=$((RETRIES-1))
            done
