name: prod-cd
on:
  push:
    branches: [ "production" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create assetlinks.json file
        run: |
          mkdir -p src/main/resources/static/.well-known
          echo '${{ secrets.ASSETLINKS_JSON }}' > src/main/resources/static/.well-known/assetlinks.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t app .
          docker tag app ${{ secrets.DOCKER_REPO_NAME }}:prod
          docker tag app ${{ secrets.DOCKER_REPO_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REPO_NAME }}:prod
          docker push ${{ secrets.DOCKER_REPO_NAME }}:${{ github.sha }}

      - name: Copy compose file to prod
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/linkyou/"

      - name: "Discord: 배포 시작"
        uses: sarisia/actions-status-discord@v1
        continue-on-error: true
        with:
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          noprefix: true
          title: "⚠️ [PROD] 배포 시작"
          description: "지금부터 잠시 5xx 에러가 발생할 수 있습니다."
          color: 0xf1c40f
          username: LinkU Deploy Bot

      - name: Deploy to prod
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/linkyou
            if [ ! -f /home/ubuntu/secrets/application-secret.properties ]; then
              echo "ERROR: /home/ubuntu/secrets/application-secret.properties not found"
              exit 1
            fi

            echo "DOCKER_REPO_NAME=${{ secrets.DOCKER_REPO_NAME }}" > /home/ubuntu/linkyou/.env

            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull ${{ secrets.DOCKER_REPO_NAME }}:prod

            cd /home/ubuntu/linkyou
            sudo docker compose -f docker-compose.prod.yml down
            sudo docker compose -f docker-compose.prod.yml up -d

            sudo docker image prune -a -f

      - name: Wait for Spring Boot to be ready
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # Spring 컨테이너가 완전히 기동될 때까지 확인. 끝까지 못 뜨면 배포 실패로 처리.
            RETRIES=10
            until curl -sf http://localhost:8080/actuator/health; do
              RETRIES=$((RETRIES-1))
              if [ $RETRIES -le 0 ]; then
                echo "ERROR: Spring Boot app did not become healthy in time"
                exit 1
              fi
              echo "Waiting for Spring Boot app to start..."
              sleep 5
            done
            echo "Spring Boot app is healthy"

      - name: "Discord: 배포 완료"
        uses: sarisia/actions-status-discord@v1
        if: success()
        continue-on-error: true
        with:
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: success
          noprefix: true
          title: "✅ [PROD] 배포 완료"
          description: "정상 서비스 중입니다."
          color: 0x2ecc71
          username: LinkU Deploy Bot

      - name: "Discord: 배포 실패"
        uses: sarisia/actions-status-discord@v1
        if: failure()
        continue-on-error: true
        with:
          webhook: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          status: failure
          noprefix: true
          title: "❌ [PROD] 배포 실패"
          description: "확인이 필요합니다."
          color: 0xe74c3c
          url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: LinkU Deploy Bot
