name: monitoring-cd
on:
  push:
    branches: [ "develop" ]
    paths:
      - "docker-compose.monitoring.yml"
      - "prometheus.monitoring.yml"
      - "grafana/**"
      - "silence-sync.sh"
      - ".github/workflows/monitoring-cd.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy monitoring files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "docker-compose.monitoring.yml,prometheus.monitoring.yml,grafana,silence-sync.sh"
          target: "/home/ubuntu/linku-monitoring/"

      - name: Deploy monitoring stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/linku-monitoring
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" > /home/ubuntu/linku-monitoring/.env

            sed -i "s|__DISCORD_ALERT_WEBHOOK_URL__|${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}|" \
              /home/ubuntu/linku-monitoring/grafana/provisioning/alerting/contact-points.yaml

            cd /home/ubuntu/linku-monitoring
            docker compose -f docker-compose.monitoring.yml pull
            docker compose -f docker-compose.monitoring.yml up -d
            docker compose -f docker-compose.monitoring.yml restart grafana
            docker image prune -f

            # silence-sync.sh: dev 서버 stop/start에 맞춰 Grafana env=dev 알림 자동 silence
            cat > /home/ubuntu/linku-monitoring/silence-sync.env <<EOF
            GRAFANA_SA_TOKEN=${{ secrets.GRAFANA_SA_TOKEN }}
            EOF
            chmod 600 /home/ubuntu/linku-monitoring/silence-sync.env
            chmod +x /home/ubuntu/linku-monitoring/silence-sync.sh

      - name: Wait for Prometheus & Grafana to be ready
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.MONITORING_HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            RETRIES=10
            until curl -sf http://localhost:9090/-/ready; do
              RETRIES=$((RETRIES-1))
              if [ $RETRIES -le 0 ]; then
                echo "ERROR: Prometheus did not become ready in time"
                exit 1
              fi
              echo "Waiting for Prometheus to start..."
              sleep 5
            done
            echo "Prometheus is ready"

            RETRIES=10
            until curl -sf http://localhost:3000/api/health; do
              RETRIES=$((RETRIES-1))
              if [ $RETRIES -le 0 ]; then
                echo "ERROR: Grafana did not become ready in time"
                exit 1
              fi
              echo "Waiting for Grafana to start..."
              sleep 5
            done
            echo "Grafana is ready"
