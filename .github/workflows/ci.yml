name: CI

on:
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make application-secret.properties
        run: |
          mkdir -p src/main/resources
          echo "$APPLICATION" > src/main/resources/application-secret.properties
        env:
          APPLICATION: ${{ secrets.APPLICATION }}

      - name: Create GCP credentials file
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_BASE64 }}" | base64 --decode > src/main/resources/gcp-credentials.json

      - name: Create Firebase admin file
        run: |
          echo "${{ secrets.FIREBASE_ADMIN_BASE64 }}" | base64 --decode > src/main/resources/linku-firebase-adminsdk.json

      - name: Create assetlinks.json
        run: |
          mkdir -p src/main/resources/static/.well-known
          echo '${{ secrets.ASSETLINKS_JSON }}' > src/main/resources/static/.well-known/assetlinks.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
