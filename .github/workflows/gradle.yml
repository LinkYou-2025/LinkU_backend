name: dev-cd
on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create assetlinks.json file
        run: |
          mkdir -p src/main/resources/static/.well-known
          echo '${{ secrets.ASSETLINKS_JSON }}' > src/main/resources/static/.well-known/assetlinks.json


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t app .
          docker tag app ${{ secrets.DOCKER_REPO_NAME }}:latest
          docker tag app ${{ secrets.DOCKER_REPO_NAME }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REPO_NAME }}:latest
          docker push ${{ secrets.DOCKER_REPO_NAME }}:${{ github.sha }}

      - name: Copy compose file to dev
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          source: "docker-compose.remote.yml"
          target: "/home/ubuntu/linkyou/"

      - name: Deploy to dev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/linkyou
            if [ ! -f /home/ubuntu/secrets/application-secret.properties ]; then
              echo "ERROR: /home/ubuntu/secrets/application-secret.properties not found"
              exit 1
            fi

            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull ${{ secrets.DOCKER_REPO_NAME }}:latest

            cd /home/ubuntu/linkyou
            export DOCKER_REPO_NAME=${{ secrets.DOCKER_REPO_NAME }}
            sudo -E docker compose -f docker-compose.remote.yml down
            sudo -E docker compose -f docker-compose.remote.yml up -d

            sudo docker image prune -a -f

      - name: Wait for Spring Boot to be ready
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            # Spring 컨테이너가 완전히 기동될 때까지 확인. 끝까지 못 뜨면 배포 실패로 처리.
            RETRIES=10
            until curl -sf http://localhost:8080/actuator/health; do
              RETRIES=$((RETRIES-1))
              if [ $RETRIES -le 0 ]; then
                echo "ERROR: Spring Boot app did not become healthy in time"
                exit 1
              fi
              echo "Waiting for Spring Boot app to start..."
              sleep 5
            done
            echo "Spring Boot app is healthy"
