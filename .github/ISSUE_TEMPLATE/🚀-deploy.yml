name: 🚀 Deploy
description: 배포 준비 및 배포 작업
title: '[Deploy] '
projects:
- LinkYou-2025/1
body:
- type: textarea
  id: environment
  attributes:
    label: 🚀 배포 대상
    description: 배포 환경, 브랜치 또는 버전, 포함할 변경 사항을 작성해주세요.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: ✅ 배포 절차
    description: 설정 변경, DB 변경 등 사전 작업과 배포 순서를 체크박스로 작성해주세요.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 🧪 배포 후 검증
    description: 상태 확인, 주요 API 동작 등 배포 성공을 확인할 방법을 작성해주세요.
  validations:
    required: true
- type: textarea
  id: rollback
  attributes:
    label: ↩️ 롤백 방법
    description: 실패 판단 기준과 이전 버전으로 복구할 절차를 작성해주세요.
  validations:
    required: false
- type: textarea
  id: notes
  attributes:
    label: 💬 비고
    description: 배포 일정, 서비스 영향이나 참고 자료를 작성해주세요.
- type: textarea
  id: related-issues
  attributes:
    label: 🔗 관련 이슈
    description: 관련된 이슈 번호를 작성해주세요.
