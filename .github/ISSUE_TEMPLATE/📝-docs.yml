name: 📝 Docs
description: 문서 작성 및 수정
title: '[Docs] '
projects:
- LinkYou-2025/1
body:
- type: textarea
  id: description
  attributes:
    label: 📝 대상 문서 및 수정 이유
    description: 문서 경로나 링크와 작성 또는 수정이 필요한 이유를 작성해주세요.
  validations:
    required: true
- type: textarea
  id: tasks
  attributes:
    label: ✅ 작업 항목
    description: 추가하거나 수정할 내용을 체크박스로 작성해주세요.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 🧪 확인 방법
    description: 내용 정확성, 예제 실행, 링크 유효성 등 확인할 항목을 작성해주세요.
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: 💬 비고
    description: 참고 자료나 논의할 내용을 작성해주세요.
- type: textarea
  id: related-issues
  attributes:
    label: 🔗 관련 이슈
    description: 관련된 이슈 번호를 작성해주세요.
