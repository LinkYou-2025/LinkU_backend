name: 📋 Task
description: 다른 유형에 해당하지 않는 일반 작업
title: '[Task] '
labels:
- 📋 Task
projects:
- LinkYou-2025/1
type: Task
body:
- type: textarea
  id: description
  attributes:
    label: 📋 작업 내용
    description: 작업할 내용과 필요한 이유를 작성해주세요.
  validations:
    required: true
- type: textarea
  id: tasks
  attributes:
    label: ✅ 작업 항목
    description: 구체적인 작업을 체크박스로 작성해주세요.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: 🎯 완료 조건
    description: 작업 완료 여부를 판단할 기준을 작성해주세요.
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: 💬 비고
    description: 참고 자료나 논의할 내용을 작성해주세요.
- type: textarea
  id: related-issues
  attributes:
    label: 🔗 관련 이슈
    description: 관련된 이슈 번호를 작성해주세요.
