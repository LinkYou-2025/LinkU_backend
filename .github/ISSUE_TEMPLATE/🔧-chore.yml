title: '[Chore] '
projects:
- LinkYou-2025/1
body:
- type: textarea
  id: description
  attributes:
    label: 📋 작업 내용
    description: 변경할 내용과 필요한 이유를 작성해주세요.
  validations:
    required: true
- type: textarea
  id: tasks
  attributes:
    label: ✅ 작업 항목
    description: 구체적인 작업을 체크박스로 작성해주세요.
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: 💬 비고
    description: 영향 범위나 참고 자료를 작성해주세요.
- type: textarea
  id: related-issues
  attributes:
    label: 🔗 관련 이슈
    description: 관련된 이슈 번호를 작성해주세요.
