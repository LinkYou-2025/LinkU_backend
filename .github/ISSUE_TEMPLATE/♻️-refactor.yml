name: 🧹 Refactor
description: 기능은 그대로, 코드 개선 요청
title: '[Refactor] '
labels:
- ♻️ Refactor
projects:
- LinkYou-2025/1
type: Refactor
body:
- type: textarea
  id: target
  attributes:
    label: 🧼 리팩토링 대상 설명
    description: 어떤 부분의 코드를 리팩토링하려는지 작성해주세요.
    placeholder: 예 - 중복된 조건문, 불필요한 클래스 분리 등
  validations:
    required: true
- type: textarea
  id: reason
  attributes:
    label: 🧼 개선 이유
    description: 리팩토링이 필요한 이유와 기대 효과를 작성해주세요.
    placeholder: 예 - 중복 로직으로 인해 변경 시 여러 곳을 수정해야 함
  validations:
    required: true
- type: textarea
  id: tasks
  attributes:
    label: ✅ 작업 항목
    description: 리팩토링할 구체적인 내용을 체크박스로 적어주세요.
    placeholder: '- [ ] 변수명 변경

      - [ ] 로직 분리

      - [ ] 리팩토링 후 테스트 코드 통과 확인

      '
  validations:
    required: true
- type: textarea
  id: notes
  attributes:
    label: 💬 비고
    description: 특별히 참고할 내용이 있다면 작성해주세요.
- type: textarea
  id: related-issues
  attributes:
    label: 🔗 관련 이슈
    description: 관련된 이슈 번호를 작성해주세요.
